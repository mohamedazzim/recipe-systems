# Recipe Systems — local dev compose (SCAFFOLD §5).
# Default profile = core: postgres + minio + nginx. `--profile identity` adds Keycloak (P1 onward —
# do NOT start it before D-06 dispatches). `observability` (later) adds the OTel collector.
#
# NOTE (dev machines): host 5433 — native Windows PostgreSQL occupies 5432 locally.
# CI and production use the standard 5432 (isolated environments).

name: recipe-systems

services:
  postgres:
    image: postgres:16
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipe_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-recipe}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe -d recipe"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for local development. MinIO's community images were withdrawn
  # from both Docker Hub (repository gone) and Quay (401), so `minio/minio` can no longer be
  # pulled; s3mock serves the S3 API the app and tests actually use. The service keeps the
  # name `minio` so S3_ENDPOINT, dev.sh's status grep and the docs stay valid.
  #
  # Port 9090 is s3mock's own; it is published on 9000 so every S3_ENDPOINT in .env.example
  # and the app defaults is unchanged. Storage is in-memory, so objects do not survive a
  # restart — fine for a dev mock, which is why there is no volume and no healthcheck (the
  # image carries neither `mc` nor `curl` to check itself with).
  minio:
    image: adobe/s3mock:latest
    profiles: [core]
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_DEFAULT_BUCKET: recipe-assets
    ports:
      - "9000:9090"

  nginx:
    image: nginx:alpine
    profiles: [core]
    ports:
      - "8080:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        # service_started, not service_healthy: the mock image has no healthcheck tooling.
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    profiles: [identity]
    command: start-dev --import-realm --http-port 8081
    environment:
      # DEV-ONLY credentials for the local Keycloak Admin Console.
      # Never reuse outside local development (Tech Stack §16: secrets are env-driven).
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ../keycloak/recipe-systems-realm.json:/opt/keycloak/data/import/recipe-systems-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081 && echo ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
