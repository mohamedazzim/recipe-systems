name: CI

# Recipe Systems — CI pipeline (SCAFFOLD §6 order, Tech Stack §20).
# lint → typecheck → unit → golden fixture + grounding validation → prisma migrate deploy
#   on ephemeral Postgres → integration → build
# QG2: the FULL cumulative suite + regression-gates.sh run on every PR (TEST_PLAN §2).
# QG3: perf baselines asserted by a dedicated job (no-op while empty).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: lint → typecheck → unit → gates → migrate → integration → build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recipe
          POSTGRES_PASSWORD: recipe_ci_password
          POSTGRES_DB: recipe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recipe -d recipe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://recipe:recipe_ci_password@localhost:5432/recipe
      NODE_ENV: ci
      SESSION_SECRET: ci-session-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt $attempt); retrying…"
            sleep 15
          done
          exit 1

      - name: Prisma generate + database build (client and dist must exist before typecheck/unit)
        working-directory: packages/database
        run: npx prisma generate && npm run build

      - name: "Schemas build (D-15: consumers import @recipe-systems/schemas via dist)"
        working-directory: packages/schemas
        run: npm run build

      - name: "LLM-adapter build (D-15/D-17: api + worker import it via dist)"
        working-directory: packages/llm-adapter
        run: npm run build

      - name: "Rendering build (D-23: api + worker import the print engine)"
        working-directory: packages/rendering
        run: npm run build

      - name: "OCR-adapter build (D-11: api imports @recipe-systems/ocr-adapter via dist)"
        working-directory: packages/ocr-adapter
        run: npm run build

      # D-23: story_d23_print launches REAL headless Chromium through the
      # Playwright runtime — the runner image ships no browsers, so install
      # the pinned Chromium (and its system libraries) before integration.
      - name: "Install Playwright Chromium (D-23 print PDF integration)"
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (full cumulative suite)
        run: npm run test

      - name: Golden fixture + grounding validation (QG2 regression gates)
        run: bash scripts/regression-gates.sh

      - name: Contract check
        run: bash scripts/contract-check.sh

      - name: Prisma migrate deploy (ephemeral Postgres)
        working-directory: packages/database
        run: npx prisma migrate deploy

      - name: Start MinIO for integration tests (same image/command as local compose)
        run: |
          MINIO_IMAGE="minio/minio:latest"
          reason=""
          for attempt in 1 2 3; do
            # Capture stdout (container id) AND stderr (the pull error). A registry failure is
            # the likely cause and its message names it exactly - "toomanyrequests", a DNS
            # error, an i/o timeout - so it must not be discarded.
            run_out=$(docker run -d --name minio -p 9000:9000 \
                 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
                 "$MINIO_IMAGE" server /data --console-address ":9001" 2>&1)
            if [ "$?" -eq 0 ]; then
              # `docker run -d` succeeds once the container is CREATED, not once it stays up.
              # A container that dies immediately used to break this loop, skip every retry,
              # and fail at the gate below printing nothing.
              sleep 3
              if [ "$(docker inspect -f '{{.State.Running}}' minio 2>/dev/null)" = "true" ]; then
                reason=""
                break
              fi
              reason="started then exited (attempt $attempt); exit=$(docker inspect -f '{{.State.ExitCode}}' minio 2>/dev/null); logs: $(docker logs minio 2>&1 | tail -20 | tr '\n' ' ')"
            else
              reason="docker run failed for $MINIO_IMAGE (attempt $attempt): $(echo "$run_out" | tail -5 | tr '\n' ' ')"
            fi
            echo "$reason"
            docker rm -f minio >/dev/null 2>&1 || true
            if [ "$attempt" -eq 1 ]; then
              echo "falling back to the official Quay mirror (Docker Hub anonymous pull limit)"
              MINIO_IMAGE="quay.io/minio/minio:latest"
            fi
            sleep 20
          done
          if ! docker ps --format '{{.Names}}' | grep -q '^minio$'; then
            # ::error:: publishes to the job's Annotations panel, which is readable WITHOUT
            # the job log. The generic "Process completed with exit code 1" is all this step
            # otherwise shows, and the cause stays buried in a log behind sign-in.
            echo "::error title=MinIO failed to start::$reason"
            echo "minio container failed to start after 3 attempts: $reason"
            exit 1
          fi
          for i in $(seq 1 60); do
            # 127.0.0.1 rather than localhost: on some runners localhost resolves to ::1 first
            # while the published port is IPv4-only, which looks identical to "never healthy".
            if curl -sf http://127.0.0.1:9000/minio/health/live; then
              echo "minio ready"; exit 0
            fi
            sleep 3
          done
          echo "minio failed to become healthy after 180s; container logs:"
          docker logs minio || true
          # Also annotated: the log lines above are unreadable without sign-in, and this
          # outcome is indistinguishable from the start gate in the Annotations panel.
          echo "::error title=MinIO never became healthy::180s on http://127.0.0.1:9000/minio/health/live; last logs: $(docker logs minio 2>&1 | tail -20 | tr '\n' ' ')"
          exit 1

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

  perf-baselines:
    name: QG3 perf baselines (asserted, no-op while empty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert .perf-baselines.json schema
        run: node scripts/check-perf-baselines.js
