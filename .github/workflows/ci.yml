name: CI

# Recipe Systems — CI pipeline (SCAFFOLD §6 order, Tech Stack §20).
# lint → typecheck → unit → golden fixture + grounding validation → prisma migrate deploy
#   on ephemeral Postgres → integration → build
# QG2: the FULL cumulative suite + regression-gates.sh run on every PR (TEST_PLAN §2).
# QG3: perf baselines asserted by a dedicated job (no-op while empty).

on:
  push:
    branches: [main]
  pull_request:
  # A targeted manual run. Actions has no "run one job" button, so the `only` input is how that
  # is expressed: it lets the e2e job be re-run alone, without waiting for the rest of the
  # pipeline. Empty input = everything, exactly as a push behaves.
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only this job — verify | e2e | perf-baselines. Empty runs everything.'
        required: false
        default: ''

jobs:
  verify:
    name: lint → typecheck → unit → gates → migrate → integration → build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.only == '' || inputs.only == 'verify'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recipe
          POSTGRES_PASSWORD: recipe_ci_password
          POSTGRES_DB: recipe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recipe -d recipe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://recipe:recipe_ci_password@localhost:5432/recipe
      NODE_ENV: ci
      SESSION_SECRET: ci-session-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt $attempt); retrying…"
            sleep 15
          done
          exit 1

      - name: Prisma generate + database build (client and dist must exist before typecheck/unit)
        working-directory: packages/database
        run: npx prisma generate && npm run build

      - name: "Schemas build (D-15: consumers import @recipe-systems/schemas via dist)"
        working-directory: packages/schemas
        run: npm run build

      - name: "LLM-adapter build (D-15/D-17: api + worker import it via dist)"
        working-directory: packages/llm-adapter
        run: npm run build

      - name: "Rendering build (D-23: api + worker import the print engine)"
        working-directory: packages/rendering
        run: npm run build

      - name: "OCR-adapter build (D-11: api imports @recipe-systems/ocr-adapter via dist)"
        working-directory: packages/ocr-adapter
        run: npm run build

      # D-23: story_d23_print launches REAL headless Chromium through the
      # Playwright runtime — the runner image ships no browsers, so install
      # the pinned Chromium (and its system libraries) before integration.
      - name: "Install Playwright Chromium (D-23 print PDF integration)"
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (full cumulative suite)
        run: npm run test

      - name: Golden fixture + grounding validation (QG2 regression gates)
        run: bash scripts/regression-gates.sh

      - name: Contract check
        run: bash scripts/contract-check.sh

      - name: Prisma migrate deploy (ephemeral Postgres)
        working-directory: packages/database
        run: npx prisma migrate deploy

      - name: Start S3-compatible storage for integration tests (s3mock)
        run: |
          # MinIO's community images were withdrawn from both registries: `minio/minio` on
          # Docker Hub now answers "repository does not exist", and `quay.io/minio/minio`
          # returns 401 for `latest` and "no such manifest" for a pinned tag. The image the
          # old step asked for cannot be pulled at all, which is why this step failed on
          # every run regardless of retries or registry order.
          #
          # s3mock is an S3-compatible server built for integration tests, it is pullable
          # from Docker Hub, and the storage integration suite passes against it. Mapping its
          # port 9090 to 9000 keeps S3_ENDPOINT identical to what the tests already expect.
          docker rm -f minio >/dev/null 2>&1 || true
          docker run -d --name minio -p 9000:9090 \
            -e COM_ADOBE_TESTING_S3MOCK_STORE_DEFAULT_BUCKET=recipe-assets \
            adobe/s3mock:latest
          for i in $(seq 1 60); do
            # 403 is the expected answer to an unauthenticated ListBuckets: it proves the
            # server is up and speaking S3, which is all this wait needs. 127.0.0.1 rather
            # than localhost, since on some runners localhost resolves to ::1 first while the
            # published port is IPv4-only.
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ || true)
            if [ "$code" = "200" ] || [ "$code" = "403" ]; then
              echo "s3mock ready (HTTP $code)"; exit 0
            fi
            sleep 3
          done
          # ::error:: publishes to the job's Annotations panel, which is readable WITHOUT the
          # job log - the generic "Process completed with exit code 1" is all this step
          # otherwise shows.
          echo "::error title=S3 storage never became ready::last logs: $(docker logs minio 2>&1 | tail -20 | tr '\n' ' ')"
          docker logs minio || true
          exit 1

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

  # The Playwright tier, automated. It was previously excluded from CI on the grounds that a
  # hosted runner has no Keycloak — but the repo's own compose provides one, so the whole stack
  # comes up here exactly as it does locally. This is the job that stops the specs rotting: six
  # of them were asserting buttons and headings that had not existed for months, and nothing was
  # checking, because a suite a human has to remember to run is not a suite.
  #
  # gated on verify: no point spinning a full stack when lint, typecheck or the unit suite failed.
  e2e:
    name: e2e (Playwright, full stack)
    runs-on: ubuntu-latest
    needs: verify
    # On a push or PR: only once verify passed. On a manual run that asked for e2e: always, since
    # verify is skipped in that case and a skipped dependency would otherwise skip this job too.
    if: |
      always() && (inputs.only == 'e2e' || (github.event_name != 'workflow_dispatch' && needs.verify.result == 'success'))
    timeout-minutes: 30
    env:
      # Faithful to .env.example, with the two switches that make a provider-free run possible.
      # Quoted deliberately: an unquoted true/900/1 is a YAML boolean or number, and Actions'
      # schema requires env values to be strings — the workflow fails validation otherwise.
      PORT: '3001'
      CORS_ORIGINS: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      AUTH_REDIRECT_BASE: http://localhost:3001
      DATABASE_URL: postgresql://recipe:recipe_dev_password@localhost:5433/recipe
      DATABASE_URL_WORKER: postgresql://recipe:recipe_dev_password@localhost:5433/recipe
      SESSION_SECRET: ci-session-secret-not-production
      SESSION_TTL_SECONDS: '900'
      # false, matching the working local .env: the specs make non-browser requests (request.post
      # carrying the CSRF cookie), and a Secure cookie is not sent over plain http. .env.example
      # documents this requirement explicitly.
      SESSION_SECURE: 'false'
      KEYCLOAK_BASE_URL: http://localhost:8081
      KEYCLOAK_REALM: recipesystems
      KEYCLOAK_CLIENT_ID: recipe-systems-bff
      # The secret the realm actually holds. .env.example carries a placeholder ending in
      # "-change-me" that the working local .env does not use; copying it here cost 18 specs
      # their login with "identity token exchange failed (401)".
      KEYCLOAK_CLIENT_SECRET: dev-bff-client-secret
      KEYCLOAK_ISSUER_URL: http://localhost:8081/realms/recipesystems
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: recipe-assets
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      # Determinism, and no key: ANALYSIS_LLM_STUB wins over MODEL_PROVIDER by design
      # (worker/src/adapter.ts), so the analysis specs exercise the real pipeline — schema gate,
      # grounding gate, persistence — against a stub that builds payloads from captured ids.
      ANALYSIS_LLM_STUB: '1'
      # OCR_PROVIDER=stub, not gemini: the intake specs must not need a credential either.
      OCR_PROVIDER: stub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build every package the stack serves
        run: |
          npm run db:generate -w @recipe-systems/database
          npm run build -w @recipe-systems/database
          npm run build -w @recipe-systems/schemas
          npm run build -w @recipe-systems/domain
          npm run build -w @recipe-systems/llm-adapter
          npm run build -w @recipe-systems/ocr-adapter
          npm run build -w @recipe-systems/rendering
          npm run build -w @recipe-systems/analysis-worker
          npm run build -w @recipe-systems/api
          npm run build -w @recipe-systems/web

      - name: Bring up Postgres, Keycloak and the S3-compatible storage
        run: docker compose -f infra/docker/docker-compose.yml --profile core --profile identity up -d

      - name: Wait for Postgres, Keycloak and storage
        run: |
          for attempt in $(seq 1 60); do
            pg=$(docker compose -f infra/docker/docker-compose.yml ps postgres --format '{{.Health}}' 2>/dev/null || true)
            kc=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/realms/recipesystems/.well-known/openid-configuration || true)
            s3=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ || true)
            if [ "$pg" = "healthy" ] && [ "$kc" = "200" ] && [ "$s3" = "200" ]; then
              echo "infra ready (postgres=$pg keycloak=$kc storage=$s3)"; exit 0
            fi
            sleep 5
          done
          echo "::error title=e2e infra never became ready::postgres=$pg keycloak=$kc storage=$s3"
          docker compose -f infra/docker/docker-compose.yml ps
          docker compose -f infra/docker/docker-compose.yml logs --tail 40
          exit 1

      - name: Migrate
        working-directory: packages/database
        run: npx prisma migrate deploy

      - name: Start the API, the worker and the web
        run: |
          # The worker is the point: the library, chef-mode and cook-log specs all wait on an
          # analysis, and scripts/dev.sh does not start it. In CI it must run, or those specs
          # fail for a reason unrelated to the code they test.
          npm run start -w @recipe-systems/api > /tmp/api.log 2>&1 &
          node apps/analysis-worker/dist/main.js > /tmp/worker.log 2>&1 &
          # -p 3000 explicitly, and from apps/web: `next start` also honours PORT, which this
          # job sets to 3001 for the API. Without the flag the web tried to bind the API's port,
          # never listened, and the readiness gate reported api=200 web=000.
          (cd apps/web && npx next start -p 3000 > /tmp/web.log 2>&1) &

      - name: Wait for the API and the web
        run: |
          for attempt in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/v1/health || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            if [ "$api" = "200" ] && [ "$web" = "200" ]; then
              echo "app ready (api=$api web=$web)"; exit 0
            fi
            sleep 5
          done
          echo "::error title=e2e app never became ready::api=$api web=$web"
          echo "--- api ---"; tail -40 /tmp/api.log || true
          echo "--- worker ---"; tail -40 /tmp/worker.log || true
          echo "--- web ---"; tail -40 /tmp/web.log || true
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the e2e tier
        # The github reporter emits one ::error:: annotation per failing spec, readable without
        # the job log. With the list reporter alone the only visible symptom is the generic
        # "Process completed with exit code 1", and the actual failures sit in a 35 MB artifact.
        run: npx playwright test --reporter=list,github

      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  perf-baselines:
    if: github.event_name != 'workflow_dispatch' || inputs.only == '' || inputs.only == 'perf-baselines'
    name: QG3 perf baselines (asserted, no-op while empty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert .perf-baselines.json schema
        run: node scripts/check-perf-baselines.js
