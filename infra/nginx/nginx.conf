# Recipe Systems — local edge (nginx). Health endpoint only at P0; routes grow per BUILD_PLAN.
server {
    listen 80;
    server_name _;

    location /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"edge"}';
    }

    location / {
        return 404 '{"status":"not_found"}';
    }
}
